name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # Same image as docker-compose.yml, so storage tests run against real PostgreSQL + pgvector.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: privatecounsel
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: privatecounsel
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://privatecounsel:ci-only@localhost:5432/privatecounsel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Tesseract is a system program, not a Python package; the OCR test needs it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      # CPU-only PyTorch: the default Linux wheel bundles several GB of CUDA libraries CI doesn't need.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q -rs   # -rs lists skipped tests, so a silently skipped OCR test shows up
