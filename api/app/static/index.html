<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrivateCounsel</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --text: #1f2328; --muted: #5f6670; --line: #dcd9d2;
    --accent: #1d4e89; --warn-bg: #fff4d6; --warn-text: #6b4e00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --panel: #1f2228; --text: #e6e6e6; --muted: #9aa1ab; --line: #33373e;
      --accent: #7fb0ec; --warn-bg: #3a3218; --warn-text: #f0d78a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .tagline { color: var(--muted); margin: 0 0 24px; }
  form { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line);
         border-radius: 10px; padding: 16px; }
  label { font-size: 0.85rem; color: var(--muted); display: grid; gap: 4px; }
  input, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                    border-radius: 6px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 84px; resize: vertical; }
  button { justify-self: start; font: inherit; color: #fff; background: var(--accent); border: 0;
           border-radius: 6px; padding: 8px 18px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: wait; }
  #status { color: var(--muted); margin: 20px 0 0; min-height: 1.5em; }
  #result { margin-top: 8px; }
  .answer { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
            white-space: pre-wrap; }
  .answer a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .warning { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 10px 14px;
             margin-bottom: 12px; }
  h2 { font-size: 1rem; margin: 24px 0 8px; }
  ol.sources { padding-left: 0; list-style: none; margin: 0; display: grid; gap: 8px; }
  ol.sources li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .num { font-weight: 600; margin-right: 6px; }
  .heading { color: var(--muted); font-size: 0.9rem; }
  ol.sources a { color: var(--accent); }
  .meta { color: var(--muted); font-size: 0.8rem; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>PrivateCounsel</h1>
  <p class="tagline">Ask a question about a matter's documents. Every answer cites the page it comes from.</p>

  <form id="ask">
    <label>Matter
      <input id="matter" name="matter" value="public-corpus" required>
    </label>
    <label>Question
      <textarea id="question" name="question" required
                placeholder="e.g. Can the trial court proceed ex parte after the defendant's counsel withdraws?"></textarea>
    </label>
    <button type="submit">Ask</button>
  </form>

  <p id="status" role="status"></p>
  <div id="result"></div>
</main>

<script>
// Answer text and document titles are untrusted (they come from uploaded documents and the model),
// so everything is added with textContent / createElement and is never parsed as HTML.
const form = document.getElementById("ask");
const statusLine = document.getElementById("status");
const result = document.getElementById("result");

function el(tag, attrs = {}, text = "") {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  if (text) node.textContent = text;
  return node;
}

function pages(c) {
  return c.page_start === c.page_end ? `p. ${c.page_start}` : `pp. ${c.page_start}-${c.page_end}`;
}

function documentLink(matter, c) {
  return `/matters/${encodeURIComponent(matter)}/documents/${c.document_id}/file#page=${c.page_start}`;
}

// Turn "... contract [1]." into text with [1] as a link to the cited page.
function answerWithLinks(text, links) {
  const box = el("div", { class: "answer" });
  text.split(/(\[\d+\])/).forEach(part => {
    const n = part.match(/^\[(\d+)\]$/);
    if (n && links[n[1]]) {
      box.append(el("a", { href: links[n[1]], target: "_blank", rel: "noopener" }, part));
    } else {
      box.append(document.createTextNode(part));
    }
  });
  return box;
}

function show(matter, data) {
  result.replaceChildren();
  if (!data.found) {
    result.append(el("div", { class: "warning" }, "Not found in this matter's documents."));
  } else if (!data.cited) {
    result.append(el("div", { class: "warning" },
      "This answer doesn't cite any source, so it can't be checked against the documents. Treat it with caution."));
  }
  const links = {};
  data.citations.forEach(c => { links[c.number] = documentLink(matter, c); });
  result.append(answerWithLinks(data.answer, links));

  if (data.citations.length) {
    result.append(el("h2", {}, "Sources"));
    const list = el("ol", { class: "sources" });
    data.citations.forEach(c => {
      const item = el("li");
      item.append(el("span", { class: "num" }, `[${c.number}]`), document.createTextNode(`${c.title}, `));
      item.append(el("a", { href: links[c.number], target: "_blank", rel: "noopener" }, pages(c)));
      if (c.heading) item.append(el("div", { class: "heading" }, c.heading));
      list.append(item);
    });
    result.append(list);
  }
  result.append(el("p", { class: "meta" }, `Model: ${data.model}`));
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const matter = document.getElementById("matter").value.trim();
  const question = document.getElementById("question").value.trim();
  const button = form.querySelector("button");
  button.disabled = true;
  result.replaceChildren();
  statusLine.textContent = "Searching the documents and writing an answer…";
  const started = Date.now();
  try {
    const response = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, matter_id: matter }),
    });
    if (!response.ok) throw new Error(`The server returned ${response.status}.`);
    show(matter, await response.json());
    statusLine.textContent = `Answered in ${((Date.now() - started) / 1000).toFixed(1)} s.`;
  } catch (error) {
    statusLine.textContent = `Something went wrong: ${error.message}`;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
