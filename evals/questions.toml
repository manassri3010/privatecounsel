[[question]]
id = "multi-damages-measure"
type = "multi"
question = "What compensation can a buyer claim when the seller breaks a contract to sell goods, and how is it measured?"
answer = "Under section 73, the injured party gets compensation for loss which naturally arose in the usual course of things from the breach, or which the parties knew when contracting was likely to result, but not for remote or indirect loss. In H. J. Baker v. MMTC (2023), the Supreme Court applied section 73: the measure of damages is the market price of the goods on the date of the breach less the contract price."
