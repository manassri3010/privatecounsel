[[question]]
id = "act-proposal"
type = "single"
question = "When is a person said to make a proposal under the Indian Contract Act?"
answer = "Under section 2(a), a person makes a proposal when he signifies to another his willingness to do or to abstain from doing anything, with a view to obtaining the assent of that other to the act or abstinence."
key_facts = [["willingness"], ["assent"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [10]
quote = "with a view to obtaining the assent of that other to such act or abstinence, he is said to make a proposal"

[[question]]
id = "act-minor"
type = "single"
question = "Can a minor enter into a valid contract?"
answer = "No. Section 11 makes competent to contract only a person who has reached the age of majority under the law he is subject to, is of sound mind and is not disqualified by law. A minor has not reached majority, so is not competent to contract."
key_facts = [["majority"], ["not competent", "incompetent", "cannot contract", "cannot enter", "is not capable"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [13]
quote = "Every person is competent to contract who is of the age of majority"

[[question]]
id = "act-unsound-mind"
type = "single"
question = "Can someone who is usually of unsound mind but occasionally lucid make a binding contract?"
answer = "Yes, but only when of sound mind. Section 12 provides that a person who is usually of unsound mind, but occasionally of sound mind, may make a contract when he is of sound mind."
key_facts = [["when he is of sound mind", "when of sound mind", "while of sound mind", "when they are of sound mind", "during a lucid"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [13]
quote = "A person who is usually of unsound mind, but occasionally of sound mind, may make a contract when he is of sound mind"

[[question]]
id = "act-silence-fraud"
type = "single"
question = "Is keeping quiet about a fact that would affect the other party's decision to contract a fraud?"
answer = "Generally no. Under the Explanation to section 17, mere silence about facts likely to affect a person's willingness to contract is not fraud, unless the circumstances make it the duty of the person keeping silence to speak, or the silence is in itself equivalent to speech."
key_facts = [["not fraud", "is not fraud", "does not amount to fraud", "not amount to fraud"], ["duty", "equivalent to speech"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [14]
quote = "Mere silence as to facts likely to affect the willingness"

[[question]]
id = "act-undue-influence-voidable"
type = "single"
question = "Can a contract obtained by undue influence be set aside?"
answer = "Yes. Under section 19A, when consent is caused by undue influence the agreement is voidable at the option of the party whose consent was so caused. The court may set it aside absolutely or, if that party received a benefit, on just terms."
key_facts = [["voidable"], ["option"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [15]
quote = "the agreement is a contract voidable at the option of the party whose consent was so caused"

[[question]]
id = "act-mutual-mistake"
type = "single"
question = "What happens to an agreement if both parties were mistaken about a fact essential to it?"
answer = "The agreement is void (section 20). An erroneous opinion about the value of the subject matter is not a mistake as to a matter of fact."
key_facts = [["void"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [16]
quote = "Where both the parties to an agreement are under a mistake as to a matter of fact essential to the agreement, the agreement is void"

[[question]]
id = "act-restraint-of-trade"
type = "single"
question = "Is a clause stopping someone from carrying on a business valid, and is there an exception when a business is sold?"
answer = "An agreement restraining anyone from exercising a lawful profession, trade or business is void to that extent (section 27). Exception 1: a seller of the goodwill of a business may agree with the buyer not to carry on a similar business within specified local limits, so long as the buyer carries on a like business there, if the limits are reasonable."
key_facts = [["void"], ["good-will", "goodwill"], ["local limits"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [18]
quote = "Every agreement by which any one is restrained from exercising a lawful profession, trade or business of any kind, is to that extent void"

[[question]]
id = "act-uncertainty"
type = "single"
question = "A agrees to sell B 'a hundred tons of oil' without saying what kind. Is the agreement enforceable?"
answer = "No. Agreements whose meaning is not certain or capable of being made certain are void (section 29); the Act's own illustration says this agreement is void for uncertainty because nothing shows what kind of oil was meant."
key_facts = [["void"], ["uncertain"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [19]
quote = "There is nothing whatever to show what kind of oil was intended"

[[question]]
id = "act-wager"
type = "single"
question = "Under section 30 of the Contract Act, can someone sue to recover money won on a bet?"
answer = "No. Agreements by way of wager are void, and no suit can be brought to recover anything alleged to be won on a wager (section 30). There is an exception for certain prizes for horse-racing."
key_facts = [["void"], ["no suit", "cannot sue", "cannot be brought", "not be brought", "cannot recover", "can not"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [19]
quote = "Agreements by way of wager are void"

[[question]]
id = "act-impossibility"
type = "single"
question = "What is the effect on a contract when, after it is made, performance becomes impossible?"
answer = "Under section 56, a contract to do an act which afterwards becomes impossible, or unlawful because of an event the promisor could not prevent, becomes void when the act becomes impossible or unlawful."
key_facts = [["void"], ["impossible"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [26]
quote = "becomes void when the act becomes impossible or unlawful"

[[question]]
id = "act-novation"
type = "single"
question = "If the parties agree to replace their contract with a new one, does the original contract still have to be performed?"
answer = "No. Under section 62, if the parties agree to substitute a new contract, or to rescind or alter it, the original contract need not be performed."
