type = "multi"
question = "What is a contract of guarantee, who are its parties, and how far is the surety liable?"
answer = "Under section 126, a contract of guarantee is a contract to perform the promise, or discharge the liability, of a third person in case of his default; the giver is the surety, the person whose default is guaranteed is the principal debtor, and the person to whom it is given is the creditor. Under section 128, the surety's liability is co-extensive with that of the principal debtor unless the contract provides otherwise."
key_facts = [["surety"], ["principal debtor"], ["creditor"], ["co-extensive", "coextensive", "co extensive"]]
