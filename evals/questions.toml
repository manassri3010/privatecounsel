[[question]]
id = "sc-recount-only-petition"
type = "single"
question = "Is a panchayat election petition that only asks for a recount of votes, without seeking a declaration that the election is void, maintainable?"
answer = "No. In Dharmin Bai Kashyap v. Babli Sahu (2023), the Supreme Court held that the reliefs in an election petition under section 122 must be in consonance with rule 6 of the Chhattisgarh Panchayats election rules (a declaration that the election is void, and optionally that another candidate was duly elected). A petition seeking only a recount was not maintainable."
key_facts = [["not maintainable"], ["declaration"]]
[[question.sources]]
document = "sc-2023-dharmin-bai-kashyap-v-babli-sahu"
