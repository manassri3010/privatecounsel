[[question]]
id = "multi-public-policy-not-contract"
type = "multi"
question = "Is an agreement whose object is opposed to public policy a contract?"
answer = "No. Under section 10, agreements are contracts only if made with a lawful consideration and a lawful object, among other conditions. Under section 23, a consideration or object is unlawful if it is forbidden by law, would defeat the provisions of any law, is fraudulent, involves injury to the person or property of another, or is regarded by the court as immoral or opposed to public policy."
key_facts = [["lawful object"], ["public policy"], ["not a contract", "is void", "void", "not enforceable", "unenforceable"]]
