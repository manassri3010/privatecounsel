# Evaluation questions (issue #44). The fixed test set every change is measured against.
#
# Written from the documents in corpus/sources.toml, not from what retrieval returns, so they don't
# flatter the current system. Page numbers are 1-based PDF pages. Each source carries a short quote
# that `python -m evals.check_questions` finds on every listed page.
#
# - type: "single" (one source answers it), "multi" (every listed source is needed),
#   "unanswerable" (nothing in the corpus answers it; the right reply is "not found").
# - key_facts: phrases a correct answer must contain. Each inner list holds alternative wordings;
#   any one of them counts. Matching ignores case.
# - also_acceptable: other passages that also answer the question, for scoring retrieval.
#
# Status: drafted from the documents; each entry still needs a human check against the cited page.

