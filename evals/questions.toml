[[question]]
id = "act-indemnity"
type = "single"
question = "What is a contract of indemnity?"
answer = "Under section 124, a contract by which one party promises to save the other from loss caused to him by the conduct of the promisor himself or of any other person."
key_facts = [["save"], ["loss"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [34]
quote = "A contract by which one party promises to save the other from loss caused to him by the conduct of the promisor himself"

[[question]]
id = "act-bailment"
type = "single"
question = "What is a bailment, and who are the bailor and bailee?"
answer = "Under section 148, a bailment is the delivery of goods by one person to another for some purpose, on a contract that they will be returned or otherwise disposed of according to the deliverer's directions when the purpose is accomplished. The person delivering the goods is the bailor; the person receiving them is the bailee."
key_facts = [["delivery of goods"], ["bailor"], ["bailee"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [39]
quote = "is the delivery of goods by one person to another for some purpose"

[[question]]
id = "act-pledge"
type = "single"
question = "What is a pledge under the Contract Act?"
answer = "Under section 172, a pledge is the bailment of goods as security for payment of a debt or performance of a promise. The bailor is called the pawnor and the bailee the pawnee."
key_facts = [["bailment"], ["security"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [42]
quote = "The bailment of goods as security for payment of a debt or performance of a promise"

[[question]]
id = "act-agent"
type = "single"
question = "Who is an agent, and who is the principal?"
answer = "Under section 182, an agent is a person employed to do any act for another, or to represent another in dealings with third persons. The person for whom the act is done, or who is so represented, is the principal."
key_facts = [["employed"], ["principal"]]
[[question.sources]]
document = "indian-contract-act-1872"
pages = [43]
quote = "is a person employed to do any act for another, or to represent another in dealings with third persons"

