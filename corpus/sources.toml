# --- Scanned copies for OCR testing ---------------------------------------------------------------
# Image-only PDFs made locally from the documents above: each page is rendered to a greyscale image
# and the text layer is dropped, which is what a law firm's scanner produces. Keeping the original
# means OCR output can be compared with the true text. pages = [first, last], 1-based, inclusive.

[[scan]]
id = "scan-indian-contract-act-1872-p1-4"
from = "indian-contract-act-1872"
pages = [1, 4]
dpi = 200
skew = 0.8   # degrees; real scans are rarely perfectly straight

[[scan]]
id = "scan-sc-1954-sakhawat-ali-v-state-of-orissa"
from = "sc-1954-sakhawat-ali-v-state-of-orissa"
pages = [1, 8]
dpi = 200
skew = 0.0   # already a real scan; this copy only removes the hidden OCR layer

[[scan]]
id = "scan-sc-2023-dharmin-bai-kashyap-low-res-p1-3"
from = "sc-2023-dharmin-bai-kashyap-v-babli-sahu"
pages = [1, 3]
dpi = 100    # deliberately poor quality, to see where OCR starts to fail
skew = 1.5
