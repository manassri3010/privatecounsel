# Public documents for the development and evaluation corpus (issue #24).
#
# corpus/fetch_corpus.py downloads these into data/corpus/ (gitignored) and writes
# data/corpus/manifest.json with each file's source URL, licence, checksum and page count.
# Only public legal texts belong here: never client documents.

[licences]
india-code = """Official text of a Central Act, published by the Legislative Department, Ministry of Law \
and Justice, on India Code (indiacode.nic.in). India Code publishes no reuse licence, so these files \
are used locally for development and testing only and are not redistributed."""
sc-judgments = """CC-BY-4.0. Indian Supreme Court Judgments dataset (Dattam Labs, AWS Open Data Registry: \
registry.opendata.aws/indian-supreme-court-judgments); original source: Supreme Court of India \
(scr.sci.gov.in)."""

