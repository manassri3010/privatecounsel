services:
  vllm:
    # Pinned for reproducible benchmarks (decision 004). v0.32.0 needs NVIDIA driver >= 580 (CUDA 13.0);
    # on older drivers set VLLM_TAG=v0.32.0-cu129.
    image: vllm/vllm-openai:${VLLM_TAG:-v0.32.0}
    command:
      - --model=${LLM_MODEL}
      - --api-key=${VLLM_API_KEY}
      - --max-model-len=8192
      - --enable-prefix-caching
      # Qwen3 "thinks" by default; RAG answers don't need it (decision 003). Requests can still opt in.
      - --reasoning-parser=qwen3
      - '--default-chat-template-kwargs={"enable_thinking": false}'
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu"]

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Localhost only: the database should never be reachable from the network.
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      # Inside compose the database is the db service, whatever .env says for running on the host.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - hf-cache:/root/.cache/huggingface  # the embedding model is downloaded once, not per container
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  hf-cache:
  pgdata:
