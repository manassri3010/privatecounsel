services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model ${LLM_MODEL}
      --api-key ${VLLM_API_KEY}
      --max-model-len 8192
      --enable-prefix-caching
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu"]

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./api
    env_file: .env
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  hf-cache:
  pgdata:
